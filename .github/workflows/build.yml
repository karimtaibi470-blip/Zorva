name: Build Zorva APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build APK
        run: |
          docker run --rm -v ${{ github.workspace }}:/home/user/hostcwd kivy/buildozer:master bash -c "cd /home/user/hostcwd && buildozer android debug"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zorva-APK
          path: bin/*.apk
