name: Build Zorva APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk zip unzip python3-pip
          pip install --upgrade pip
          pip install buildozer cython==0.29.33
      - name: Accept Android Licenses
        run: |
          mkdir -p ~/.android
          echo "count=0" > ~/.android/repositories.cfg
          if [ -f buildozer.spec ]; then
            sed -i 's/#*android.accept_sdk_license_agreements.*/android.accept_sdk_license_agreements = True/' buildozer.spec
            grep -q "accept_sdk_license" buildozer.spec || echo "android.accept_sdk_license_agreements = True" >> buildozer.spec
          fi
      - name: Build APK
        run: |
          yes | buildozer android debug || true
          buildozer android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zorva-APK
          path: bin/*.apk
