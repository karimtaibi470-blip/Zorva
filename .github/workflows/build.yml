name: Build Zorva APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install system deps
        run: |
          sudo apt update
          sudo apt install -y openjdk-17-jdk unzip zip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev automake lld
          pip install --upgrade pip
          pip install buildozer cython==0.29.36
      - name: Accept Android Licenses
        run: |
          mkdir -p ~/.android/licenses
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > ~/.android/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> ~/.android/licenses/android-sdk-license
          echo "24333f8a63b6825ea9c5514f83c1059b8ea73125" >> ~/.android/licenses/android-sdk-license
          cp -r ~/.android/licenses/* ~/.buildozer/android/platform/android-sdk/licenses/ 2>/dev/null || true
      - name: Build APK
        run: |
          yes | buildozer android debug || true
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          cp ~/.android/licenses/* ~/.buildozer/android/platform/android-sdk/licenses/ 2>/dev/null || true
          yes | ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          buildozer android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zorva-APK
          path: bin/*.apk
